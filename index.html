<!doctype html>
<html lang="ja">
<head>

<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7fb,#11151d);--panel:light-dark(#fff,#1a202b);--panel2:light-dark(#f1f4f9,#222a37);--text:light-dark(#172033,#edf2fa);--muted:light-dark(#68748a,#a5b0c2);--line:light-dark(#e0e6ef,#303b4b);--accent:light-dark(#315fc5,#83a7ff);--accent2:light-dark(#eaf0ff,#263653);--green:light-dark(#16835d,#65d5a6);--red:light-dark(#c64c56,#ff8b93);--amber:light-dark(#a76b12,#f3c36b);--shadow:0 8px 28px rgba(18,34,65,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Noto Sans JP",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg)}.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:17px max(18px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:4}.brand{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:13px;background:var(--accent2);color:var(--accent);display:grid;place-items:center;font-size:21px}.brand h1{font-size:18px;margin:0;letter-spacing:.02em}.brand p{margin:1px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.shell{max-width:1180px;margin:auto;padding:24px 18px 54px}.nav{display:flex;gap:7px;overflow:auto;padding-bottom:20px}.nav button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 15px;border-radius:12px;font-weight:600}.nav button.active{background:var(--accent2);border-color:var(--accent);color:var(--accent)}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:10px 14px;font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.subtle{background:var(--panel2)}.btn.danger{color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 17px}.heading h2{margin:0;font-size:24px;letter-spacing:-.02em}.heading p{margin:5px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow);min-width:0}.stat-label{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:7px}.stat-value{font-size:clamp(20px,2.7vw,28px);font-weight:750;letter-spacing:-.04em;margin-top:9px;overflow-wrap:anywhere}.stat-note{color:var(--muted);font-size:12px;margin-top:4px}.positive{color:var(--green)}.negative{color:var(--red)}.two-col{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}.section-title{font-size:16px;font-weight:750;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.section-title small{font-size:12px;font-weight:500;color:var(--muted)}.bucket-list{display:grid;gap:13px}.bucket{display:flex;align-items:center;gap:12px}.bucket-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--panel2);font-size:20px;flex-shrink:0}.bucket-main{flex:1;min-width:0}.bucket-name{font-weight:700}.bucket-desc{color:var(--muted);font-size:12px;margin-top:2px}.bucket-amount{font-weight:750;text-align:right;white-space:nowrap}.bar{height:5px;background:var(--panel2);border-radius:9px;margin-top:8px;overflow:hidden}.bar span{display:block;height:100%;border-radius:9px;background:var(--accent)}.muted{color:var(--muted)}.small-text{font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:650}td{font-size:13px}tbody tr:last-child td{border-bottom:0}.amount{text-align:right;font-weight:750;font-variant-numeric:tabular-nums}.tag{display:inline-flex;align-items:center;border-radius:8px;background:var(--panel2);padding:4px 8px;font-size:11px;font-weight:700}.tag.income{color:var(--green)}.tag.expense{color:var(--red)}.tag.advance{color:var(--amber)}.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}.notice{background:var(--accent2);border-radius:12px;padding:12px 14px;color:var(--text);font-size:13px;margin-bottom:15px}.notice strong{color:var(--accent)}.pill-row{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:8px 11px;border:1px solid var(--line);background:var(--panel);border-radius:10px;color:var(--muted);font-size:13px}.pill.active{color:var(--accent);border-color:var(--accent);background:var(--accent2)}.split{display:flex;align-items:center;justify-content:space-between;gap:12px}.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.list-row strong{font-size:14px}.list-row .meta{font-size:12px;color:var(--muted);margin-top:3px}.modal-backdrop{position:fixed;inset:0;background:#05091499;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.open{display:flex}.modal{width:min(570px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 20px 70px #0004}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.modal-head h3{margin:0;font-size:19px}.icon-btn{border:0;background:var(--panel2);color:var(--text);border-radius:9px;width:35px;height:35px;font-size:19px}.hidden{display:none!important}.footer-note{color:var(--muted);font-size:12px;text-align:center;margin-top:22px}.settings-stack{display:grid;gap:14px}.warning{color:var(--amber)}@media(max-width:780px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.shell{padding:18px 13px 40px}.topbar{padding:12px 14px}.brand h1{font-size:16px}.top-actions .btn{padding:8px 10px}.heading h2{font-size:21px}.card{padding:15px}}@media(max-width:420px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.stat-value{font-size:22px}.top-actions .hide-mobile{display:none}.heading{align-items:flex-start;flex-direction:column}.heading>.btn{align-self:stretch}}
.month-picker-backdrop{position:fixed;inset:0;background:#05091499;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.month-picker-backdrop.open{display:flex}.month-picker{width:min(390px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 20px 70px #0004}.month-picker-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.month-picker-year{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}.month-picker-months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.month-picker-month{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:13px 8px;font-weight:700}.month-picker-month.current{border-color:var(--accent);background:var(--accent2);color:var(--accent)}.cal-month{cursor:pointer;border-radius:8px;padding:4px 8px}.cal-month:hover{background:var(--panel2)}.nav-order-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.nav-order-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.nav-order-row:last-child{border-bottom:0}.nav-order-name{flex:1;min-width:0;font-weight:650}.nav-order-actions{display:flex;gap:5px}.nav-order-actions button{min-width:38px}
</style>

<body><div class="app" id="app">
<header class="topbar"><div class="brand"><div class="logo">¥</div><div><h1>わたしの家計簿</h1><p>お金の出どころまで、きちんと管理。</p></div></div><div class="top-actions"><button class="btn hide-mobile" id="exportTop">↓ バックアップ</button><button class="btn primary" id="quickAdd">＋ 記録する</button></div></header>
<main class="shell"><nav class="nav" id="nav"><button class="active" data-page="home">⌂ ダッシュボード</button><button data-page="calendar">▦ カレンダー</button><button data-page="transactions">≡ 取引履歴</button><button data-page="bulk">▤ 一括入力</button><button data-page="buckets">▦ お金の管理枠</button><button data-page="advances">↗ 立替・精算</button><button data-page="settings">⚙ 設定・保存</button></nav><section id="content"></section><p class="footer-note">この試作品のデータは、現在のブラウザ内に保存されます。定期的にバックアップを保存してください。</p></main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h3 id="modalTitle">取引を記録</h3><button class="icon-btn" id="closeModal" aria-label="閉じる">×</button></div><div id="modalBody"></div></div></div>
<input id="importFile" type="file" accept="application/json,.json" class="hidden">
<script>
(()=>{'use strict';
const renderCalendarOriginal=renderCalendar;renderCalendar=function(){let html=renderCalendarOriginal();const [yy,mm]=calendarMonth.split('-').map(Number),offset=new Date(yy,mm-1,1).getDay();const grid=html.match(/<div class="cal-grid">([\s\S]*?)<\/div><p class="small-text muted"/);if(grid){const weekdays=['日','月','火','水','木','金','土'].map(d=>`<div class="cal-weekday">${d}</div>`).join('');const dayButtons=[...grid[1].matchAll(/<button class="cal-day\b[\s\S]*?<\/button>/g)].map(m=>m[0]);const cells=Array(offset).fill('<div class="cal-day outside"></div>').concat(dayButtons);while(cells.length%7)cells.push('<div class="cal-day outside"></div>');html=html.replace(/<div class="cal-grid">[\s\S]*?<\/div><p class="small-text muted"/,'<div class="cal-grid">'+weekdays+cells.join('')+'</div><p class="small-text muted"')}html=html.replace(`<div class="cal-month">${yy}年${mm}月</div>`,`<div style="display:flex;align-items:center;gap:8px"><button class="btn small" data-cal-today onclick="window.goCalendarToday()">今日</button><div class="cal-month">${yy}年${mm}月</div></div>`);return html};window.goCalendarToday=()=>{calendarMonth=today().slice(0,7);calendarDate=today();render()};
const STORE='watashi_kakeibo_v1';
const NAV_ORDER_KEY='watashi_kakeibo_nav_order_v1';
const NAV_ITEMS=[['home','⌂ ダッシュボード'],['calendar','▦ カレンダー'],['transactions','≡ 取引履歴'],['bulk','▤ 一括入力'],['buckets','▦ お金の管理枠'],['advances','↗ 立替・精算'],['settings','⚙ 設定・保存']];
function getNavOrder(){try{const saved=JSON.parse(localStorage.getItem(NAV_ORDER_KEY)||'null');if(Array.isArray(saved)){const valid=saved.filter((id,i)=>NAV_ITEMS.some(x=>x[0]===id)&&saved.indexOf(id)===i);return [...valid,...NAV_ITEMS.map(x=>x[0]).filter(id=>!valid.includes(id))]}}catch(e){}return NAV_ITEMS.map(x=>x[0])}
function saveNavOrder(order){localStorage.setItem(NAV_ORDER_KEY,JSON.stringify(order))}
function applyNavOrder(){const nav=document.getElementById('nav');if(!nav)return;const order=getNavOrder();for(const id of order){const b=nav.querySelector(`[data-page="${id}"]`);if(b)nav.appendChild(b)}}
function renderNavOrderSettings(){const order=getNavOrder();return `<div class="card" style="margin-top:15px"><h3 class="section-title">ナビゲーションの並べ替え</h3><p class="small-text muted">画面上部の「ダッシュボード、カレンダー、取引履歴…」の表示順を変更できます。設定はこのブラウザに保存されます。</p><div id="navOrderRows">${order.map((id,i)=>{const item=NAV_ITEMS.find(x=>x[0]===id);return `<div class="nav-order-row" data-nav-order-row="${id}"><span class="nav-order-name">${esc(item?.[1]||id)}</span><div class="nav-order-actions"><button class="btn small" data-nav-move="up" data-nav-id="${id}" aria-label="${esc(item?.[1]||id)}を上へ" ${i===0?'disabled':''}>↑</button><button class="btn small" data-nav-move="down" data-nav-id="${id}" aria-label="${esc(item?.[1]||id)}を下へ" ${i===order.length-1?'disabled':''}>↓</button></div></div>`}).join('')}</div><div class="nav-order-tools"><button class="btn primary" data-nav-order-save>並び順を保存</button><button class="btn" data-nav-order-reset>初期順に戻す</button></div></div>`}
const icons={allowance:'🪙',food:'🍱',transport:'🚃',parttime:'💼',other:'📦',wallet:'👛',bank:'🏦'};
const defaultState=()=>({version:1,buckets:[{id:'b_allowance',name:'お小遣い',icon:'🪙',opening:10000,note:'自由に使えるお金'},{id:'b_food',name:'食費',icon:'🍱',opening:5000,note:'食事用として受け取ったお金'},{id:'b_transport',name:'交通費',icon:'🚃',opening:3000,note:'通学・移動用'},{id:'b_other',name:'その他',icon:'📦',opening:0,note:'自由に追加できます'}],locations:[{id:'l_wallet',name:'財布',opening:15000},{id:'l_bank',name:'銀行',opening:3000}],transactions:[],advances:[],settings:{currency:'JPY'}});
let state=load(),page='home',filter='all',editingId=null,calendarMonth=today().slice(0,7),calendarDate=today();
function load(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&s.version===1&&Array.isArray(s.buckets)&&Array.isArray(s.locations)&&Array.isArray(s.transactions)&&Array.isArray(s.advances))return s}catch(e){}return defaultState()}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function uid(prefix){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function yen(n){return new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Math.round(n||0))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function bucket(id){return state.buckets.find(x=>x.id===id)}function location(id){return state.locations.find(x=>x.id===id)}function sum(xs,fn){return xs.reduce((a,x)=>a+fn(x),0)}
function bucketBalance(id){const b=bucket(id);if(!b)return 0;let v=Number(b.opening)||0;for(const t of state.transactions){if(t.type==='income'&&t.bucketId===id)v+=t.amount;if(t.type==='expense'&&t.bucketId===id)v-=t.amount;if(t.type==='bucketTransfer'){if(t.fromBucketId===id)v-=t.amount;if(t.toBucketId===id)v+=t.amount}}return v}
function locationBalance(id){const l=location(id);if(!l)return 0;let v=Number(l.opening)||0;for(const t of state.transactions){if(t.locationId===id&&(t.type==='income'||t.type==='repayment'))v+=t.amount;if(t.locationId===id&&(t.type==='expense'||t.type==='advance'))v-=t.amount;if(t.type==='locationTransfer'){if(t.fromLocationId===id)v-=t.amount;if(t.toLocationId===id)v+=t.amount}}return v}
function openAdv(id){const a=state.advances.find(x=>x.id===id);return a?Math.max(0,a.amount-sum(a.payments,p=>p.amount)):0}
function totalLocation(){return sum(state.locations,l=>locationBalance(l.id))}function totalBuckets(){return sum(state.buckets,b=>bucketBalance(b.id))}function totalReceivable(){return sum(state.advances,a=>openAdv(a.id))}
function monthTransactions(){const m=today().slice(0,7);return state.transactions.filter(t=>t.date&&t.date.slice(0,7)===m)}
function realIncome(txs){return sum(txs.filter(t=>t.type==='income'),t=>t.amount)}function realExpense(txs){return sum(txs.filter(t=>t.type==='expense'),t=>t.amount)}
function typeLabel(t){return ({income:'収入',expense:'支出',bucketTransfer:'枠間移動',locationTransfer:'保管場所の移動',advance:'立替払い',repayment:'立替返金'})[t]||t}
function transactionLabel(t){if(t.type==='bucketTransfer')return `${bucket(t.fromBucketId)?.name||'—'} → ${bucket(t.toBucketId)?.name||'—'}`;if(t.type==='locationTransfer')return `${location(t.fromLocationId)?.name||'—'} → ${location(t.toLocationId)?.name||'—'}`;return bucket(t.bucketId)?.name||'—'}
function amountClass(t){if(t.type==='income'||t.type==='repayment')return 'positive';if(t.type==='expense'||t.type==='advance')return 'negative';return ''}
function signed(t){if(t.type==='income'||t.type==='repayment')return '+'+yen(t.amount);if(t.type==='expense'||t.type==='advance')return '−'+yen(t.amount);return yen(t.amount)}
function txRow(t){return `<tr><td>${esc(t.date)}</td><td><span class="tag ${t.type==='income'?'income':t.type==='expense'?'expense':t.type==='advance'?'advance':''}">${typeLabel(t.type)}</span></td><td>${esc(t.title||transactionLabel(t))}<div class="small-text muted">${esc(t.note||'')}</div></td><td>${esc(transactionLabel(t))}</td><td class="amount ${amountClass(t)}">${signed(t)}</td><td><button class="btn small" data-edit-tx="${t.id}">詳細</button></td></tr>`}
function empty(msg){return `<div class="empty">${msg}</div>`}
function pageHead(title,desc,button=''){return `<div class="heading"><div><h2>${title}</h2><p>${desc}</p></div>${button}</div>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const c=document.getElementById('content');if(page==='home')c.innerHTML=renderHome();if(page==='calendar')c.innerHTML=renderCalendar();if(page==='transactions')c.innerHTML=renderTransactions();if(page==='bulk')c.innerHTML=renderBulkEntry();if(page==='buckets')c.innerHTML=renderBuckets();if(page==='advances')c.innerHTML=renderAdvances();if(page==='settings')c.innerHTML=renderSettings();const monthButton=c.querySelector('.cal-month');if(monthButton){monthButton.setAttribute('role','button');monthButton.setAttribute('tabindex','0');monthButton.setAttribute('aria-label','年月を選択');monthButton.addEventListener('click',openMonthPicker);monthButton.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMonthPicker()}})}}
function openMonthPicker(){let year=Number(calendarMonth.slice(0,4)),month=Number(calendarMonth.slice(5,7));const overlay=document.createElement('div');overlay.className='month-picker-backdrop open';overlay.innerHTML=`<div class="month-picker" role="dialog" aria-modal="true" aria-label="年月を選択"><div class="month-picker-head"><button class="btn" data-year-step="-1" aria-label="前年">‹</button><div class="month-picker-year" id="monthPickerYear">${year}年</div><button class="btn" data-year-step="1" aria-label="翌年">›</button></div><div class="month-picker-months">${Array.from({length:12},(_,i)=>`<button class="month-picker-month ${year===Number(calendarMonth.slice(0,4))&&i+1===Number(calendarMonth.slice(5,7))?'current':''}" data-pick-month="${i+1}">${i+1}月</button>`).join('')}</div><button class="btn" data-picker-close style="width:100%;margin-top:14px">キャンセル</button></div>`;document.body.appendChild(overlay);const yearLabel=overlay.querySelector('#monthPickerYear');overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('[data-picker-close]')){overlay.remove();return}const step=e.target.closest('[data-year-step]');if(step){year+=Number(step.dataset.yearStep);yearLabel.textContent=year+'年';overlay.querySelectorAll('[data-pick-month]').forEach(b=>b.classList.toggle('current',year===Number(calendarMonth.slice(0,4))&&Number(b.dataset.pickMonth)===Number(calendarMonth.slice(5,7))));return}const picked=e.target.closest('[data-pick-month]');if(picked){calendarMonth=`${year}-${String(Number(picked.dataset.pickMonth)).padStart(2,'0')}`;calendarDate=calendarMonth+'-01';overlay.remove();render()}});const onKey=e=>{if(e.key==='Escape'){overlay.remove();document.removeEventListener('keydown',onKey)}};document.addEventListener('keydown',onKey)}
function renderCalendar(){const [yy,mm]=calendarMonth.split('-').map(Number),first=new Date(yy,mm-1,1),days=new Date(yy,mm,0).getDate(),offset=(first.getDay()+6)%7;const prev=new Date(yy,mm-2,1),next=new Date(yy,mm,1);const monthTx=state.transactions.filter(t=>t.date&&t.date.slice(0,7)===calendarMonth);const dayCells=Array.from({length:Math.ceil((offset+days)/7)*7},(_,i)=>{const day=i-offset+1;if(day<1||day>days)return '<div class="cal-day outside"></div>';const date=`${calendarMonth}-${String(day).padStart(2,'0')}`,tx=monthTx.filter(t=>t.date===date),spent=sum(tx.filter(t=>t.type==='expense'||t.type==='advance'),t=>t.amount),income=sum(tx.filter(t=>t.type==='income'),t=>t.amount);return `<button class="cal-day ${calendarDate===date?'selected':''} ${tx.length?'has-tx':''}" data-cal-day="${date}"><span class="cal-number">${day}</span>${spent?`<span class="cal-spend">−${yen(spent)}</span>`:''}${income?`<span class="cal-income">+${yen(income)}</span>`:''}${tx.length?`<span class="cal-count">${tx.length}件</span>`:''}</button>`}).join('');const selected=state.transactions.filter(t=>t.date===calendarDate).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));const selectedSpent=sum(selected.filter(t=>t.type==='expense'||t.type==='advance'),t=>t.amount);const selectedIncome=realIncome(selected);return `${pageHead('カレンダー','日付ごとに、いつ・いくら使ったかを確認。','<button class="btn primary" data-action="new-tx">＋ 取引を記録</button>')}<style>.calendar-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:15px}.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.cal-month{font-size:20px;font-weight:800}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.cal-weekday{text-align:center;color:var(--muted);font-size:12px;font-weight:700;padding:7px 0}.cal-day{min-width:0;min-height:83px;padding:7px 5px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}.cal-day.outside{background:var(--panel2);border-color:transparent}.cal-day.selected{border:2px solid var(--accent);background:var(--accent2);padding:6px 4px}.cal-day.has-tx{background:light-dark(#f8faff,#202b3d)}.cal-number{font-weight:800;font-size:13px}.cal-spend{font-size:11px;color:var(--red);font-weight:750;overflow-wrap:anywhere}.cal-income{font-size:11px;color:var(--green);font-weight:750;overflow-wrap:anywhere}.cal-count{font-size:10px;color:var(--muted)}.cal-summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.cal-summary>div{background:var(--panel2);border-radius:12px;padding:12px}.cal-summary strong{display:block;font-size:18px;margin-top:4px}.cal-tx{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.cal-tx:last-child{border-bottom:0}.cal-tx-main{flex:1;min-width:0}.cal-tx-title{font-weight:700;overflow-wrap:anywhere}.cal-tx-meta{font-size:12px;color:var(--muted);margin-top:3px}.cal-tx-amount{font-weight:800;white-space:nowrap}@media(max-width:780px){.calendar-layout{grid-template-columns:1fr}.cal-day{min-height:66px;padding:5px 3px}.cal-day.selected{padding:4px 2px}.cal-spend,.cal-income{font-size:10px}.cal-count{display:none}}@media(max-width:420px){.cal-day{min-height:57px}.cal-number{font-size:12px}.cal-spend,.cal-income{font-size:9px}.cal-grid{gap:3px}}</style><div class="calendar-layout"><div class="card"><div class="cal-head"><button class="btn" data-cal-prev aria-label="前の月">‹</button><div class="cal-month">${yy}年${mm}月</div><button class="btn" data-cal-next aria-label="次の月">›</button></div><div class="cal-grid">${['月','火','水','木','金','土','日'].map(d=>`<div class="cal-weekday">${d}</div>`).join('')}${dayCells}</div><p class="small-text muted" style="margin:13px 0 0">赤：支出・立替払い　緑：収入。日付を選ぶと、その日の取引を確認できます。</p></div><div class="card"><h3 class="section-title">${calendarDate.replaceAll('-','年').replace(/^(.+)年(\d+)年(\d+)$/, '$1年$2月$3日')}の記録</h3><div class="cal-summary"><div><span class="small-text muted">使った金額</span><strong class="negative">${yen(selectedSpent)}</strong></div><div><span class="small-text muted">受け取った金額</span><strong class="positive">${yen(selectedIncome)}</strong></div></div>${selected.length?selected.map(t=>`<div class="cal-tx"><div class="cal-tx-main"><div class="cal-tx-title">${esc(t.title||transactionLabel(t))}</div><div class="cal-tx-meta">${typeLabel(t.type)} · ${esc(transactionLabel(t))}${t.note?' · '+esc(t.note):''}</div></div><div class="cal-tx-amount ${amountClass(t)}">${signed(t)}</div><button class="btn small" data-edit-tx="${t.id}">編集</button></div>`).join(''):empty('この日の取引はありません。')}<button class="btn subtle" style="margin-top:13px;width:100%" data-action="new-tx" data-date="${calendarDate}">＋ この日付で記録</button></div></div>`}
function renderHome(){const m=monthTransactions(),income=realIncome(m),expense=realExpense(m),bals=state.buckets.map(b=>({b,v:bucketBalance(b.id)}));const tx=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt).slice(0,6);return `${pageHead('ダッシュボード','お金の全体像と、使い道ごとの残高を確認。','<button class="btn primary" data-action="new-tx">＋ 取引を記録</button>')}<div class="grid stats"><div class="card"><div class="stat-label">👛 実際の所持金</div><div class="stat-value">${yen(totalLocation())}</div><div class="stat-note">財布・銀行などの合計</div></div><div class="card"><div class="stat-label">↗ 立替未精算</div><div class="stat-value">${yen(totalReceivable())}</div><div class="stat-note">返金待ちのお金</div></div><div class="card"><div class="stat-label">🧾 今月の収入</div><div class="stat-value positive">${yen(income)}</div><div class="stat-note">立替返金は含まない</div></div><div class="card"><div class="stat-label">🛍 今月の支出</div><div class="stat-value negative">${yen(expense)}</div><div class="stat-note">立替払いは含まない</div></div></div><div class="grid two-col"><div class="card"><h3 class="section-title">使い道ごとの残高 <small>管理枠</small></h3><div class="bucket-list">${bals.map(({b,v})=>`<div class="bucket"><div class="bucket-icon">${esc(b.icon||'📦')}</div><div class="bucket-main"><div class="bucket-name">${esc(b.name)}</div><div class="bucket-desc">${esc(b.note||'用途未設定')}</div><div class="bar"><span style="width:${Math.min(100,Math.max(0,v/Math.max(1,...bals.map(x=>Math.max(0,x.v)))*100))}%"></span></div></div><div class="bucket-amount ${v<0?'negative':''}">${yen(v)}</div></div>`).join('')}</div><div class="notice" style="margin:17px 0 0">管理枠は「何のためのお金か」の区分。実際の財布・銀行残高とは別に計算されます。</div><button class="btn subtle" style="margin-top:12px" data-go="buckets">管理枠を編集 →</button></div><div class="card"><h3 class="section-title">保管場所 <small>実際のお金</small></h3>${state.locations.map(l=>`<div class="list-row"><div><strong>${esc(l.name)}</strong><div class="meta">開始残高 ${yen(l.opening)}</div></div><strong>${yen(location function renderTransactions(){let tx=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);if(filter!=='all')tx=tx.filter(t=>t.type===filter);return `${pageHead('取引履歴','収入・支出・移動・立替をまとめて確認。','<button class="btn primary" data-action="new-tx">＋ 取引を記録</button>')}<div class="card"><div class="pill-row" style="margin-bottom:13px">${[['all','すべて'],['income','収入'],['expense','支出'],['bucketTransfer','枠間移動'],['advance','立替払い'],['repayment','返金']].map(([v,l])=>`<button class="pill ${filter===v?'active':''}" data-filter="${v}">${l}</button>`).join('')}</div>${tx.length?`<div class="table-wrap"><table><thead><tr><th>日付</th><th>種類</th><th>内容</th><th>管理枠</th><th class="amount">金額</th><th></th></tr></thead><tbody>${tx.map(txRow).join('')}</tbody></table></div>`:empty('条件に合う取引はありません。')}</div>`}
function renderBulkEntry(){return `${pageHead('一括入力','複数の取引を表にまとめ、検証してから一度に保存します。')}<div class="notice"><strong>使い方：</strong>表に直接入力するか、Excelのセル範囲をコピーして下の貼り付け欄へ貼り付けます。CSVファイルも読み込めます。Excel（.xlsx）ファイルそのものではなく、Excelからコピーまたは「CSV UTF-8」で保存したファイルに対応します。立替払いでは「返金する人」も入力できます。</div><div class="card"><h3 class="section-title">① Excelから貼り付け／CSV読み込み</h3><div class="field"><label for="bulkPaste">列順：日付、種類、内容・名称、金額、管理枠、保管場所、カテゴリ、メモ、返金する人</label><textarea id="bulkPaste" rows="4" placeholder="2026-10-01\t立替払い\t家族の買い物\t2500\tお小遣い\t財布\t\t返金待ち\t家族"></textarea></div><div class="form-actions" style="justify-content:flex-start"><button class="btn" id="bulkPasteApply">貼り付け内容を表に反映</button><label class="btn" for="bulkCsvFile">CSVファイルを選択</label><input id="bulkCsvFile" class="hidden" type="file" accept=".csv,text/csv,text/tab-separated-values"></div></div><div class="card" style="margin-top:15px"><div class="split"><h3 class="section-title" style="margin:0">② 入力表</h3><div class="pill-row"><button class="btn small" id="bulkAddRow">＋ 行を追加</button><button class="btn small" id="bulkClearRows">入力をクリア</button></div></div><p class="small-text muted">種類は「収入」「支出」「立替払い」。金額は1円以上の整数。管理枠・保管場所は登録済みの名前を選びます。立替払いは返金待ちとして登録され、通常の支出には計上されません。</p><div class="table-wrap" style="margin-top:12px"><table id="bulkTable"><thead><tr><th>日付</th><th>種類</th><th>内容・名称</th><th>金額</th><th>管理枠</th><th>保管場所</th><th>カテゴリ</th><th>メモ</th><th>返金する人</th><th></th></tr></thead><tbody id="bulkRows">${bulkRowHtml()}</tbody></table></div><div class="form-actions"><button class="btn primary" id="bulkValidate">入力を検証</button><button class="btn primary" id="bulkSave" disabled>検証後に一括保存</button></div><div id="bulkValidation" aria-live="polite"></div></div><div class="card" style="margin-top:15px"><h3 class="section-title">CSVの列順</h3><p class="small-text muted">1行目は見出しとして扱わず、すべての行をデータとして読み込みます。列は「日付,種類,内容・名称,金額,管理枠,保管場所,カテゴリ,メモ,返金する人」の順です。日付は YYYY-MM-DD、種類は「収入」「支出」「立替払い」にしてください。返金する人は立替払いの場合に任意で入力します。</p></div>`}
function bulkRowHtml(v={}){const type=['income','expense','advance'].includes(v.type)?v.type:'expense';return `<tr><td><input data-bulk="date" type="date" value="${esc(v.date||today())}" required style="min-width:135px"></td><td><select data-bulk="type"><option value="expense" ${type==='expense'?'selected':''}>支出</option><option value="income" ${type==='income'?'selected':''}>収入</option><option value="advance" ${type==='advance'?'selected':''}>立替払い</option></select></td><td><input data-bulk="title" value="${esc(v.title||'')}" placeholder="昼食" required style="min-width:130px"></td><td><input data-bulk="amount" inputmode="decimal" value="${esc(v.amount??'')}" placeholder="650" required style="width:100px"></td><td><select data-bulk="bucketId" style="min-width:130px"><option value="">選択してください</option>${state.buckets.map(b=>`<option value="${esc(b.id)}" ${v.bucketId===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></td><td><select data-bulk="locationId" style="min-width:110px"><option value="">選択してください</option>${state.locations.map(l=>`<option value="${esc(l.id)}" ${v.locationId===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></td><td><input data-bulk="category" value="${esc(v.category||'')}" placeholder="日常" style="min-width:100px"></td><td><input data-bulk="note" value="${esc(v.note||'')}" style="min-width:130px"></td><td><input data-bulk="person" value="${esc(v.person||'')}" placeholder="例：家族" style="min-width:100px"></td><td><button type="button" class="btn small danger" data-bulk-remove>削除</button></td></tr>`}
function parseBulkDelimited(text,delimiter){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&quoted&&text[i+1]==='"'){cell+='"';i++}else if(c==='"'){quoted=!quoted}else if(c===delimiter&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];cell=''}else cell+=c}if(cell!==''||row.length){row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row)}return rows}
function bulkDelimitedToValues(text,delimiter){return parseBulkDelimited(text,delimiter).map(c=>{const raw=(c[1]||'').trim();let type='';if(/^(収入|income)$/i.test(raw))type='income';else if(/^(支出|expense)$/i.test(raw))type='expense';else if(/^(立替払い|立替|advance)$/i.test(raw))type='advance';return {date:(c[0]||'').trim(),type,title:(c[2]||'').trim(),amount:(c[3]||'').trim(),bucketName:(c[4]||'').trim(),locationName:(c[5]||'').trim(),category:(c[6]||'').trim(),note:(c[7]||'').trim(),person:(c[8]||'').trim()}})}
function bulkApplyValues(values){const mapped=values.map(v=>{const b=state.buckets.find(x=>x.name===v.bucketName),l=state.locations.find(x=>x.name===v.locationName);return {date:v.date,type:v.type,title:v.title,amount:v.amount,bucketId:b?.id||'',locationId:l?.id||'',category:v.category,note:v.note,person:v.person}});document.getElementById('bulkRows').innerHTML=mapped.map(bulkRowHtml).join('')||bulkRowHtml();document.getElementById('bulkSave').disabled=true;document.getElementById('bulkValidation').innerHTML=`<div class="notice">${mapped.length}行を表に反映しました。管理枠・保管場所の名前が一致しない場合は未選択になるため、表で選び直してください。</div>`}
function bulkValidate(){const rows=[...document.querySelectorAll('#bulkRows tr')],errors=[],valid=[];rows.forEach((tr,i)=>{const get=n=>tr.querySelector(`[data-bulk="${n}"]`)?.value.trim()||'',v={date:get('date'),type:get('type'),title:get('title'),amount:get('amount'),bucketId:get('bucketId'),locationId:get('locationId'),category:get('category'),note:get('note'),person:get('person')};if(!v.title&&!v.amount&&!v.bucketId&&!v.locationId&&!v.category&&!v.note&&!v.person)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(v.date)||(()=>{const d=new Date(v.date+'T12:00:00');return Number.isNaN(d.getTime())||d.toISOString().slice(0,10)!==v.date})())errors.push(`${i+1}行目：日付を確認してください。`);if(!['income','expense','advance'].includes(v.type))errors.push(`${i+1}行目：種類を確認してください。`);if(!v.title)errors.push(`${i+1}行目：内容・名称が必要です。`);const amount=Number(v.amount.replace(/,/g,''));if(!Number.isSafeInteger(amount)||amount<=0)errors.push(`${i+1}行目：金額は1円以上の整数で入力してください。`);if(!bucket(v.bucketId)||!allowedBucketIds(v.type).includes(v.bucketId))errors.push(`${i+1}行目：種類に対応した管理枠を選択してください。`);if(!location(v.locationId))errors.push(`${i+1}行目：保管場所を選択してください。`);if(!errors.some(x=>x.startsWith(`${i+1}行目：`)))valid.push({...v,amount,createdAt:Date.now()+i,id:uid('tx')})});const out=document.getElementById('bulkValidation');if(errors.length){out.innerHTML=`<div class="notice"><strong>入力に問題があります（${errors.length}件）。</strong><ul>${errors.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>修正後、もう一度「入力を検証」を押してください。</div>`;document.getElementById('bulkSave').disabled=true;window._bulkValidated=null;return}if(!valid.length){out.innerHTML='<div class="notice">保存できる行がありません。1行以上入力してください。</div>';document.getElementById('bulkSave').disabled=true;window._bulkValidated=null;return}window._bulkValidated={rows:valid,count:valid.length,signature:bulkValidationSignature()};out.innerHTML=`<div class="notice"><strong>検証成功：</strong>${valid.length}行を保存できます。収入 ${valid.filter(x=>x.type==='income').length}行、支出 ${valid.filter(x=>x.type==='expense').length}行、立替払い ${valid.filter(x=>x.type==='advance').length}行。まだ保存はされていません。</div>`;document.getElementById('bulkSave').disabled=false}
function bulkCommit(){if(!window._bulkValidated?.rows?.length)return alert('先に入力を検証してください。');const current=[...document.querySelectorAll('#bulkRows tr')].map(tr=>[...tr.querySelectorAll('[data-bulk]')].map(el=>el.value).join('\u001f')).join('\u001e');const prior=window._bulkValidated.signature;if(prior&&prior!==current){window._bulkValidated=null;document.getElementById('bulkSave').disabled=true;return alert('検証後に入力内容が変わりました。もう一度検証してください。')}const rows=window._bulkValidated.rows;if(!confirm(`${rows.length}行を家計簿に一括保存します。よろしいですか？`))return;for(const row of rows){if(row.type==='advance'){const a={id:uid('adv'),date:row.date,title:row.title||'立替払い',amount:row.amount,person:row.person||'',locationId:row.locationId,bucketId:row.bucketId,note:row.note||'',payments:[],createdAt:row.createdAt};state.advances.push(a);state.transactions.push({...row,type:'advance',advanceId:a.id,person:a.person,category:undefined})}else state.transactions.push(row)}save();window._bulkValidated=null;page='transactions';render();alert(`${rows.length}行を保存しました。`)}

function generateDueRecurring(){if(!Array.isArray(state.recurring))state.recurring=[];let changed=false;const now=today();for(const r of state.recurring){if(!r.active)continue;if(!Array.isArray(r.generatedDates))r.generatedDates=[];const start=(r.startDate||now).slice(0,7);let cursor=new Date(start+'-01T12:00:00');const end=new Date(now.slice(0,7)+'-01T12:00:00');while(cursor<=end){const y=cursor.getFullYear(),m=cursor.getMonth()+1,last=new Date(y,m,0).getDate(),day=Math.min(Math.max(1,Number(r.day)||1),last),date=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;if(date>=(r.startDate||now)&&date<=now&&!r.generatedDates.includes(date)){state.transactions.push({id:uid('tx'),type:r.type,date,amount:Number(r.amount),bucketId:r.bucketId,locationId:r.locationId,category:r.category||'定期',title:r.title||'定期取引',note:r.note||'定期設定から自動作成',recurringId:r.id,createdAt:Date.now()});r.generatedDates.push(date);changed=true}cursor.setMonth(cursor.getMonth()+1)} }if(changed)save()}
function bucketsForType(type){const names=type==='expense'?['お小遣い','経費食費','経費']:['お小遣い','経費','臨時収入'];return state.buckets.filter(b=>names.includes(b.name))}function ensureNamedBuckets(){const defs=[['お小遣い','🪙','自由に使えるお金'],['食費','🍱','食事用のお金'],['経費食費','🍱','経費として扱う食費'],['経費','💼','経費用のお金'],['臨時収入','💰','臨時的な収入']];let changed=false;for(const [name,icon,note] of defs)if(!state.buckets.some(b=>b.name===name)){state.buckets.push({id:uid('b'),name,icon,opening:0,note});changed=true}if(changed)save()}function syncBucketChoices(form,type){const el=form?.elements?.bucketId;if(!el)return;const list=bucketsForType(type);const old=el.value;el.innerHTML=options(list,list.some(b=>b.id===old)?old:list[0]?.id);if(list.length)el.value=list.some(b=>b.id===old)?old:list[0].id}function syncAdvanceBucketChoice(form){const el=form?.elements?.bucketId;if(!el)return;const allowance=state.buckets.filter(b=>b.name==='お小遣い');const old=el.value;el.innerHTML=options(allowance,allowance.some(b=>b.id===old)?old:allowance[0]?.id);if(allowance.length)el.value=allowance.some(b=>b.id===old)?old:allowance[0].id}const txFormOriginal=txForm;txForm=function(kind='expense',presetBucket='',existing=null){txFormOriginal(kind,presetBucket,existing);const form=document.getElementById('txForm');if(form){const type=form.elements.type.value;if(type==='income'||type==='expense')syncBucketChoices(form,type);else if(type==='advance')syncAdvanceBucketChoice(form)}};const advanceFormOriginal=advanceForm;advanceForm=function(){advanceFormOriginal();syncAdvanceBucketChoice(document.getElementById('advanceForm'))};const recurringFormOriginal=recurringForm;recurringForm=function(){recurringFormOriginal();const form=document.getElementById('recurringForm');if(form){syncBucketChoices(form,form.elements.type.value);form.elements.type.addEventListener('change',()=>syncBucketChoices(form,form.elements.type.value))}};const renderHomeOriginal=renderHome;renderHome=function(){return renderHomeOriginal()+renderRecurringPanel()};const function defaultBucketRuleIds(type){const names=type==='expense'?['お小遣い','経費食費','経費']:type==='advance'?['お小遣い']:['お小遣い','経費','臨時収入'];const found=state.buckets.filter(b=>names.includes(b.name)).map(b=>b.id);return found.length?found:state.buckets.slice(0,1).map(b=>b.id)}function allowedBucketIds(type){const rules=state.settings?.bucketRules;if(Array.isArray(rules?.[type])){const valid=rules[type].filter(id=>state.buckets.some(b=>b.id===id));return valid.length?valid:state.buckets.slice(0,1).map(b=>b.id)}return defaultBucketRuleIds(type)}bucketsForType=function(type){const ids=allowedBucketIds(type);return state.buckets.filter(b=>ids.includes(b.id))};syncAdvanceBucketChoice=function(form){const el=form?.elements?.bucketId;if(!el)return;const list=bucketsForType('advance');const old=el.value;el.innerHTML=options(list,list.some(b=>b.id===old)?old:list[0]?.id);if(list.length)el.value=list.some(b=>b.id===old)?old:list[0].id};const renderSettingsRulesOriginal=renderSettings;renderSettings=function(){const html=renderSettingsRulesOriginal();const types=[['income','収入'],['expense','支出'],['advance','立替払い']];const ruleCard='<div class="card" style="margin-top:15px"><h3 class="section-title">取引の種類ごとの管理枠</h3><p class="small-text muted">各取引で選択できる管理枠を設定します。定期収入・定期支出にも同じ設定が適用されます。管理枠間の移動元・移動先は、ここでは制限しません。</p>'+types.map(([type,label])=>`<div class="list-row" style="display:block"><strong>${label}</strong><div class="form-grid" data-rule-type="${type}" style="margin-top:9px">${state.buckets.map(b=>`<label style="display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px"><input type="checkbox" data-rule-bucket="${esc(b.id)}" ${allowedBucketIds(type).includes(b.id)?'checked':''}> ${esc(b.icon||'📦')} ${esc(b.name)}</label>`).join('')}</div></div>`).join('')+'<button class="btn primary" data-save-bucket-rules style="margin-top:14px">管理枠の設定を保存</button></div>';return html.replace('<h3 class="section-title">管理枠の設定</h3>',ruleCard+'<h3 class="section-title">管理枠の設定</h3>')};document function calculateAmountExpression(value){const s=String(value??'').replace(/,/g,'').replace(/\s+/g,'');if(!s)return NaN;const tokens=s.match(/(?:\d+(?:\.\d*)?|\.\d+|[()+\-*/])/g);if(!tokens||tokens.join('')!==s)return NaN;let i=0;function expression(){let v=term();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],n=term();v=op==='+'?v+n:v-n}return v}function term(){let v=factor();while(tokens[i]==='*'||tokens[i]==='/'){const op=tokens[i++],n=factor();if(op==='/'&&n===0)throw Error('division by zero');v=op==='*'?v*n:v/n}return v}function factor(){const t=tokens[i++];if(t==='+')return factor();if(t==='-')return -factor();if(t==='('){const v=expression();if(tokens[i++]!==')')throw Error('missing parenthesis');return v}if(t===undefined||! /^(?:\d+(?:\.\d*)?|\.\d+)$/.test(t))throw Error('invalid expression');return Number(t)}try{const result=expression();return i===tokens.length&&Number.isFinite(result)?result:NaN}catch(e){return NaN}}const showModalOriginalForMath=showModal;showModal=function(title,html){showModalOriginalForMath(title,html);const body=document.getElementById('modalBody'),form=body.querySelector('form'),amount=form?.elements?.amount;if(!amount)return;amount.type='text';amount.inputMode='decimal';amount.placeholder='例：1200+350、5000-800';amount.title='四則演算（+、-、*、/、括弧）が使えます';const hint=document.createElement('div');hint.className='small-text muted';hint.textContent='金額欄は計算式OK：例 1200+350、5000-800、1200/3（小数は1円単位に四捨五入）';amount.parentElement.appendChild(hint);form.addEventListener('submit',e=>{const result=calculateAmountExpression(amount.value);if(!Number.isFinite(result)||result<=0){e.preventDefault();e.stopImmediatePropagation();alert('金額の計算式を確認してください。例：1200+350');return}amount.value=String(Math.round(result))},true)};

function advanceForm(){showModal('立替を記録',`<form id="advanceForm"><div class="form-grid">${field('立替日','date',input('date',today(),'date'))}${field('立替金額（円）','amount',input('amount','','number','min="1" step="1" required'))}${field('内容','title',input('title','','text','placeholder="例：家族の買い物"'),true)}${field('返金する人','person',input('person','','text','placeholder="例：家族"'))}${field('支払った保管場所','locationId',select('locationId',options(state.locations,state.locations[0]?.id),state.locations[0]?.id))}${field('管理枠（参考）','bucketId',select('bucketId',options(state.buckets,state.buckets[0]?.id),state.buckets[0]?.id))}${field('メモ','note',input('note','','text'),true)}</div><div class="notice" style="margin-top:13px">立替分は通常の支出には含めず、返金待ちとして記録します。実際に支払った保管場所の残高は減少します。</div><div class="form-actions"><button type="button" class="btn" id="cancelAdv">キャンセル</button><button class="btn primary" type="submit">立替を保存</button></div></form>`);document.getElementById('cancelAdv').onclick=closeModal;document.getElementById('advanceForm').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.amount=Number(o.amount);if(o.amount<=0)return alert('金額は1円以上で入力してください。');const a={...o,id:uid('adv'),createdAt:Date.now(),payments:[]};state.advances.push(a);state.transactions.push({id:uid('tx'),type:'advance',date:o.date,amount:o.amount,title:o.title||'立替払い',person:o.person,locationId:o.locationId,bucketId:o.bucketId,note:o.note||'',advanceId:a.id,createdAt:Date.now()});save();closeModal();render()}}

function bucketForm(existing){const b=existing||{name:'',icon:'📦',opening:0,note:''};showModal(existing?'管理枠を編集':'管理枠を追加',`<form id="bucketForm"><div class="form-grid">${field('名前','name',input('name',b.name,'text','required'),true)}${field('アイコン（絵文字）','icon',input('icon',b.icon||'📦','text'))}${field('開始残高（円）','opening',input('opening',b.opening,'number','step="1" required'))}${field('用途・説明','note',input('note',b.note||'','text'),true)}</div><div class="notice" style="margin-top:13px">開始残高は、この家計簿で記録を始める時点の金額です。過去の受取を二重に記録しないようにしてください。</div><div class="form-actions"><button type="button" class="btn" id="cancelBucket">キャンセル</button>${existing?'<button type="button" class="btn danger" id="deleteBucket">削除</button>':''}<button class="btn primary" type="submit">保存する</button></div></form>`);document.getElementById('cancelBucket').onclick=closeModal;document.getElementById('bucketForm').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.opening=Number(o.opening);if(existing)Object.assign(existing,o);else state.buckets.push({...o,id:uid('b')});save();closeModal();render()};if(existing)document.getElementById('deleteBucket').onclick=()=>{if(state.transactions.some(t=>t.bucketId===existing.id||t.fromBucketId===existing.id||t.toBucketId===existing.id)||state.advances.some(a=>a.bucketId===existing.id))return alert('この管理枠を使っている取引があります。先に取引を修正してください。');if(confirm('この管理枠を削除しますか？')){state.buckets=state.buckets.filter(x=>x.id!==existing.id);save();closeModal();render()}}}

function metrics(s){const tx=s.data.transactions||[],sum=fn=>tx.filter(fn).reduce((a,t)=>a+(Number(t.amount)||0),0);return `容量 ${sizeLabel(s.raw)} · 取引 ${tx.length}件 · 収入 ${sum(t=>t.type==='income').toLocaleString('ja-JP')}円 · 支出 ${sum(t=>t.type==='expense').toLocaleString('ja-JP')}円`}
function setStatus(msg,bad=false){const el=$('#driveSyncStatus');if(el){el.textContent=msg;el.style.color=bad?'var(--red)':'var(--muted)'}}
function ensureUI(){if($('#driveSyncButton'))return;const btn=document.createElement('button');btn.id='driveSyncButton';btn.className='btn';btn.textContent='☁ Drive同期';$('.top-actions')?.appendChild(btn);btn.addEventListener('click',openPanel);const style=document.createElement('style');style.textContent='#driveSyncPanel{position:fixed;inset:0;background:#05091499;z-index:100;display:none;align-items:center;justify-content:center;padding:14px}#driveSyncPanel.open{display:flex}#driveSyncPanel .drive-box{width:min(650px,100%);max-height:92vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 20px 70px #0005}#driveSyncPanel .drive-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#driveSyncPanel .drive-option{border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:10px}#driveSyncPanel input{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text)}';document.head.appendChild(style);const panel=document.createElement('div');panel.id='driveSyncPanel';panel.innerHTML=`<div class="drive-box" role="dialog" aria-modal="true" aria-labelledby="driveSyncTitle"><div class="split"><h2 id="driveSyncTitle" style="margin:0;font-size:21px">Google Drive同期</h2><button class="icon-btn" id="driveSyncClose" aria-label="閉じる">×</button></div><p class="small-text muted">ブラウザ内の家計簿を先に保護し、Driveのバックアップと比較してから同期します。初回はGoogleのOAuthクライアントIDが必要です。</p><div class="field" style="margin-top:14px"><label for="driveClientId">OAuthクライアントID（Webアプリ）</label><input id="driveClientId" autocomplete="off" placeholder="xxxxx.apps.googleusercontent.com"></div><div class="drive-actions"><button class="btn" id="driveSaveClient">IDをこのブラウザに保存</button><button class="btn primary" id="driveConnect">Googleに接続して比較</button></div><p id="driveSyncStatus" class="small-text muted" role="status" aria-live="polite">未接続。同期を始めるにはGoogleに接続してください。</p><div id="driveCompare"></div><div class="drive-actions"><button class="btn" id="driveUseLocal" disabled>ブラウザのデータを採用</button><button class="btn primary" id="driveUseCloud" disabled>Driveのデータを採用</button></div><p class="small-text muted">同期先の変更前に、置き換えられるデータをDrive内の復旧用ファイルとして保存します。通信に失敗した場合は同期せず、ブラウザ内のデータを維持します。</p></div>`;document.body.appendChild(panel);$('#driveClientId').value=localStorage.getItem(CLIENT_KEY)||'';$('#driveSyncClose').onclick=()=>panel.classList.remove('open');panel.addEventListener('click',e=>{if(e.target===panel)panel.classList.remove('open')});$('#driveSaveClient').onclick=()=>{const id=$('#driveClientId').value.trim();if(!id.endsWith('.apps.googleusercontent.com'))return setStatus('クライアントIDの形式を確認してください。',true);localStorage.setItem(CLIENT_KEY,id);setStatus('クライアントIDをこのブラウザに保存しました。',false)};$('#driveConnect').onclick=connectAndCompare;$('#driveUseLocal').onclick=()=>applyChoice('local');$('#driveUseCloud').onclick=()=>applyChoice('cloud')}
function openPanel(){ensureUI();$('#driveSyncPanel').classList.add('open');const savedId=localStorage.getItem(CLIENT_KEY);if(savedId)$('#driveClientId').value=savedId;if(!navigator.onLine){setStatus('オフラインです。家計簿は引き続きブラウザ内で使えます。',true);return}if(accessToken&&Date.now()<accessTokenExpiresAt){setStatus('認証済みです。比較・同期を行うには「Googleに接続して比較」を押してください。')}else setStatus(savedId?'未接続。比較・同期を行うには「Googleに接続して比較」を押してください。':'未接続。OAuthクライアントIDを設定し、Googleに接続してください。')}
async function api(url,options={}){const res=await fetch(url,{...options,headers:{Authorization:'Bearer '+accessToken,...(options.headers||{})}});if(!res.ok){let msg='Google Drive API error '+res.status;try{const j=await res.json();msg=j.error?.message||msg}catch{}throw Error(msg)}return res.status===204?null:res.json()}
function requestToken(){if(accessToken&&Date.now()<accessTokenExpiresAt)return Promise.resolve(accessToken);return new Promise((resolve,reject)=>{const id=$('#driveClientId').value.trim();if(!id.endsWith('.apps.googleusercontent.com'))return reject(Error('有効なOAuthクライアントIDを入力してください。'));localStorage.setItem(CLIENT_KEY,id);if(!window.google?.accounts?.oauth2)return reject(Error('Google認証ライブラリの読み込みを待ってから、もう一度お試しください。'));tokenClient=google.accounts.oauth2.initTokenClient({client_id:id,scope:SCOPE,callback:resp=>{if(resp.error)reject(Error(resp.error));else{accessToken=resp.access_token;accessTokenExpiresAt=Date.now()+Math.max(0,(Number(resp.expires_in)||3600)-60)*1000;resolve(accessToken)}},error_callback:err=>reject(Error(err?.message||'Google認証に失敗しました。'))});tokenClient.requestAccessToken({prompt:''})})}
async function findCloud(){const q=encodeURIComponent("name='"+FILE_NAME+"' and 'appDataFolder' in parents and trashed=false");const r=await api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime,size,version)&q='+q);return r.files?.[0]||null}
async function readCloud(file){const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media',{headers:{Authorization:'Bearer '+accessToken}});if(!r.ok)throw Error('Driveバックアップの読み込みに失敗しました（'+r.status+'）。');const raw=await r.text(),wrap=JSON.parse(raw);const data=wrap.data;if(!data||data.version!==1||!Array.isArray(data.transactions)||!Array.isArray(data.buckets))throw Error('Drive上のバックアップ形式が想定と異なります。安全のため同期を中止しました。');return {raw,data,updated:wrap.updatedAt||file.modifiedTime||null}}
async function connectAndCompare(){setStatus('Googleに接続しています…');$('#driveUseLocal').disabled=true;$('#driveUseCloud').disabled=true;$('#driveCompare').innerHTML='';try{localSnapshot=getLocal();await requestToken();cloudFile=await findCloud();cloudSnapshot=cloudFile?await readCloud(cloudFile):null;cloudModified=cloudFile?.modifiedTime||null;const localCard=`<div class="drive-option"><strong>📱 このブラウザ</strong><p class="small-text">${escHtml(metrics(localSnapshot))}</p><p class="small-text muted">最終記録：${escHtml(fmtDate(localSnapshot.updated))}</p></div>`;if(!cloudSnapshot){$('#driveCompare').innerHTML=localCard+'<div class="drive-option"><strong>☁ Google Drive</strong><p class="small-text">バックアップはまだありません。</p><p class="small-text muted">初回同期では、ブラウザのデータをDriveに新規保存します。</p></div>';$('#driveUseLocal').disabled=false;$('#driveUseLocal').textContent='ブラウザのデータをDriveに保存';setStatus('接続済み。Driveにバックアップがないため、ブラウザ側から初回保存できます。');return}const cloudCard=`<div class="drive-option"><strong>☁ Google Drive</strong><p class="small-text">${escHtml(metrics(cloudSnapshot))}</p><p class="small-text muted">最終更新：${escHtml(fmtDate(cloudSnapshot.updated))}</p></div>`;const same=localSnapshot.raw===JSON.stringify(cloudSnapshot.data);$('#driveCompare').innerHTML=localCard+cloudCard+(same?'<div class="notice">両方のデータ内容は一致しています。</div>':'<div class="notice">どちらを採用するか選んでください。更新日時だけで自動選択はしません。</div>');$('#driveUseLocal').disabled=false;$('#driveUseCloud').disabled=false;$('#driveUseLocal').textContent='ブラウザ → Drive';$('#driveUseCloud').textContent='Drive → ブラウザ';setStatus(same?'接続済み。データは一致しています。':'接続済み。採用するデータを選んでください。')}catch(e){setStatus(e.message||'接続できませんでした。ブラウザのデータは変更していません。',true)}}
async function createDriveFile(name,content){const boundary='-------kakeibo'+Math.random().toString(16).slice(2);const meta={name,parents:['appDataFolder'],mimeType:'application/json'};const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+content+'\r\n--'+boundary+'--';return api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime,version',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body})}
async function updateDriveFile(file,content){const boundary='-------kakeibo'+Math.random().toString(16).slice(2);const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n{}\r\n--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+content+'\r\n--'+boundary+'--';return api('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(file.id)+'?uploadType=multipart&fields=id,name,modifiedTime,version',{method:'PATCH',headers:{'Content-Type':'multipart/related; boundary='+boundary},body})}
async function backupToDrive(label,snapshot){const wrapped=JSON.stringify({format:'watashi-kakeibo-recovery-v1',label,updatedAt:new Date().toISOString(),data:snapshot.data});return createDriveFile('家計簿復旧用_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json',wrapped)}
async function applyChoice(choice){const local=localSnapshot,cloud=cloudSnapshot,file=cloudFile,knownModified=cloudModified;try{setStatus('データを保護し、同期先を再確認しています…');$('#driveUseLocal').disabled=true;$('#driveUseCloud').disabled=true;const latest=await findCloud();if((file?.id||null)!==(latest?.id||null)||(knownModified||null)!==(latest?.modifiedTime||null))throw Error('比較後にDrive側が変更されました。データの上書きを防ぐため、もう一度比較してください。');if(choice==='local'){if(cloud)await backupToDrive('同期前のDriveデータ',cloud);const wrapped=JSON.stringify({format:'watashi-kakeibo-v1',updatedAt:new Date().toISOString(),data:local.data});if(latest)await updateDriveFile(latest,wrapped);else await createDriveFile(FILE_NAME,wrapped);localStorage.setItem(KEY+'_sync_updated',new Date().toISOString());setStatus('ブラウザのデータをDriveに保存しました。');await connectAndCompare()}else{if(!cloud)throw Error('Driveバックアップが存在しません。');await backupToDrive('同期前のブラウザデータ',local);const latestAgain=await findCloud();if(!latestAgain||latestAgain.id!==file.id||latestAgain.modifiedTime!==knownModified)throw Error('Drive側が変更されました。もう一度比較してください。');localStorage.setItem(KEY,JSON.stringify(cloud.data));localStorage.setItem(KEY+'_sync_updated',new Date().toISOString());setStatus('Driveのデータを画面に反映しました。');window.dispatchEvent(new Event('kakeibo-data-restored'));$('#driveSyncPanel').classList.remove('open')}}catch(e){setStatus((e.message||'同期に失敗しました。')+' データは可能な限り変更せず、再比較をおすすめします。',true);$('#driveUseLocal').disabled=false;$('#driveUseCloud').disabled=!cloud}}
window.addEventListener('online',()=>{if($('#driveSyncPanel')?.classList.contains('open'))setStatus('オンラインに戻りました。必要ならGoogleに再接続してください。')});document.addEventListener('DOMContentLoaded',ensureUI);if(document.readyState!=='loading')ensureUI();
})();
</script>
</body></html>
